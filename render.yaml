databases:
  - name: chess-logic-db
    plan: free
    databaseName: chess_logic
    user: chess_logic

services:
  - type: web
    name: chess-logic-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chess-logic-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
