services:
  - type: web
    name: chess-logic-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false   # set manually in the Render dashboard — points at Neon, not a Render-managed database
      - key: SECRET_KEY
        generateValue: true
